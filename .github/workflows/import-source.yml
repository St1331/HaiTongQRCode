name: Normalize imported documentation

on:
  push:
    branches:
      - feat/P1-T1-monorepo-bootstrap

permissions:
  contents: write

jobs:
  normalize-documentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/P1-T1-monorepo-bootstrap

      - name: Normalize imported baseline filename
        shell: bash
        run: |
          bad_file="$(find docs -maxdepth 1 -type f ! -name 'API.md' ! -name 'OPERATIONS.md' ! -name '开发基线文档.md' -print -quit)"
          test -n "$bad_file"
          cp "$bad_file" 'docs/开发基线文档.md'
          git rm "$bad_file"
          git add 'docs/开发基线文档.md'

      - name: Commit normalized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: normalize development baseline filename"
          git push origin HEAD:feat/P1-T1-monorepo-bootstrap
